<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1212">
  <title>斩妖塔 · 印契录</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="game.js"></script>
  <script defer src="arena.js"></script>
  <script defer src="sound.js"></script>
  <script defer src="screen.js"></script>
</head>
<body data-phase="start">
<main class="playfield">
  <div class="stage">
    <canvas id="plate" role="img" aria-label="塔内场景"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <button id="hotspot" class="target" hidden><span class="target-reticle" aria-hidden="true"></span><span id="charge-label" aria-hidden="true"></span><span class="sr" id="target-label"></span></button>
    <output id="hit" class="float foe" aria-hidden="true"></output>
    <output id="recoil" class="float self" aria-hidden="true"></output>
  </div>
  <header class="mast">
    <div class="wordmark"><i class="brand-mark" aria-hidden="true"></i>印契录</div>
    <ol class="steps" aria-label="登塔进度"><li>照影廊</li><li>狐灯市</li><li>沉钟殿</li></ol>
    <nav aria-label="游戏工具">
      <button id="sound" aria-label="打开声音" title="打开声音" aria-pressed="false"></button>
      <button id="record" aria-label="行囊与行记" title="行囊与行记"></button>
      <button id="help" aria-label="操作指南" title="操作指南"></button>
    </nav>
  </header>
  <section class="story" aria-labelledby="title">
    <div class="place"><i aria-hidden="true"></i><span id="chapter"></span><span class="slash" aria-hidden="true">/</span><span id="room"></span></div>
    <h1 id="title"></h1>
    <div class="enemy" id="enemy" hidden><div class="hp-track"><i id="foe-meter"></i></div><span id="foe-hp"></span></div>
    <p id="description"></p>
    <p id="intent"></p>
  </section>
  <section class="dock" aria-label="当前行动">
    <div class="player">
      <div class="wielder"><span class="blood-dot" aria-hidden="true"></span><strong id="equipped"></strong><span id="hp"></span></div>
      <div class="hp-track"><i id="life"></i></div>
      <div class="pouch"><span id="gold"></span><span id="seals"></span></div>
    </div>
    <div class="controls"><div id="action-prompt"></div><div id="actions"></div></div>
  </section>
  <div id="beat" role="status"></div>
  <span class="sr" id="announce" role="status"></span>
</main>
<dialog id="guide"><h2>操作指南</h2><ol><li>点妖或轻按 J 出剑。每战可合锋一次：按住妖物或 J，光环亮起时松手，本剑多斩 2 血。按 K 格挡。佩戴回声盘时可按 L 布阵。</li><li>妖物会等你出手。看清本手和下手的攻势，决定先斩、守势还是截招。</li><li>妖印可以买卖或嵌器。道友知道上层的消息，狐商收购自己需要的纹样。</li></ol><label class="assist"><input type="checkbox" id="assist"> 免长按合锋（战斗区显示合锋按钮）</label><form method="dialog"><button autofocus>返回塔内</button></form></dialog>
<dialog id="history"><h2>行囊与行记</h2><div id="bag"></div><p id="seed"></p><ol id="chronicle"></ol><form method="dialog"><button autofocus>返回塔内</button></form></dialog>
</body></html>
